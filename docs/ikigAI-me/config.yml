# IkigAI v0.3 — personal config
# Bespoke. Read by daemons and prompts. The friend gets their own.

owner:
  name: Benji Zorella
  github: ijnebzor
  timezone: Australia/Melbourne

retrieval:
  default_gear: 2
  gear_inference: heuristic_then_llm
  per_context_modifiers: true

brief:
  cadence: daily
  generate_at: "07:00"
  available_at: "07:30"
  channel: pwa
  max_length_words: 600

daemons:
  watcher:
    enabled: true
    inbox_path: ~/ikigAI-me/inbox
  scout:
    enabled: true
    schedule: "0 2 * * *"  # 02:00 daily
  keeper:
    enabled: true
    schedule: "0 3 * * *"  # 03:00 daily
    decay_rate: 0.98
  herald:
    enabled: true
    schedule: "0 7 * * *"  # 07:00 daily
  gatekeeper:
    enabled: true
    poll_minutes: 15
    label: IkigAI/Inbox
  scribe:
    enabled: true
    cache_days: 14
    write_on: accepted_only

mcp:
  bind_addr: 100.x.x.x:8765   # Tailscale IP
  tools:
    - ikigai_capture
    - ikigai_retrieve
    - ikigai_phase_an_idea
    - ikigai_brief_today
    - ikigai_debaiser

llm:
  local:
    provider: ollama
    base_url: http://localhost:11434
    default_model: llama3.2:latest
    fallback_model: mixtral:8x7b
  cloud:
    provider: anthropic
    gear_2_model: claude-haiku-4-5
    gear_3_model: claude-sonnet-4-5

voice_prefs:
  brief: ijneb-dev
  retrieval: prepaired
  drift_alerts: accountantability
  debaiser: helpful

vault:
  path: ~/ikigAI-me
  git_remote: git@github.com:ijnebzor/ikigAI-me.git  # private mirror
  auto_commit: true
  commit_message_format: "[{daemon}] {action}: {summary}"
