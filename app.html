<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="IkigAI"/>
<meta name="description" content="The framework overlays. Compounding becomes visible. You act on what was already there."/>
<link rel="manifest" href="manifest.json"/>
<title>ikigAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d0d;--surface:#0f0f0f;--surface2:#141414;--card:#161616;--border:#1e1e1e;--border2:#2a2a2a;--muted:#1a1a1a;--sub:#8a8a84;--text:#e8e8e2;--text-dim:#5a5a55;--text-bright:#f9fafb;--accent:#c8f135;--accent-dim:rgba(200,241,53,0.15);--accent-soft:rgba(200,241,53,0.06);--cyan:#00d4ff;--green:#00ff88;--orange:#ff8c42;--coral:#ff6b6b;--purple:#a78bfa;--yellow:#eab308;--red:#ef4444;--blue:#00aaff;--region-love:#ff6b9d;--region-good:#c8f135;--region-needs:#00d4ff;--region-paid:#ffaa3d;--safe-b:env(safe-area-inset-bottom,0px);--radius:6px;--radius-sm:3px;--mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;--body:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.colour-bar{height:2px;background:linear-gradient(90deg,var(--accent) 0%,var(--green) 35%,var(--cyan) 70%,var(--purple) 100%);opacity:.6;flex-shrink:0}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.logo-text{font-family:var(--display);font-size:14px;font-weight:800;color:var(--text);letter-spacing:.02em}
.logo-text .accent{color:var(--accent)}
.logo-sub{color:var(--sub);font-size:8px;letter-spacing:.1em;font-family:var(--mono);margin-left:auto}
.main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px 8px}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-b);position:relative;z-index:400}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px;gap:3px;border:none;background:none;cursor:pointer;color:var(--sub);font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;position:relative;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.nav-icon{font-size:16px;line-height:1}
.nav-overlay{color:var(--sub)}
.nav-overlay:active{opacity:.7}

/* Cards & layout */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.card.gc{border-color:rgba(200,241,53,0.25)}
.card.go{border-color:rgba(255,140,66,0.25)}
.card.gg{border-color:rgba(0,255,136,0.25)}
.card.gp{border-color:rgba(167,139,250,0.25)}
.card.gr{border-color:rgba(239,68,68,0.25)}
.card.gy{border-color:rgba(234,179,8,0.25)}
.sl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;font-family:var(--mono)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border)}
.kpi .lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--sub);margin-bottom:4px;font-family:var(--mono)}
.kpi .val{font-size:22px;font-weight:700;line-height:1;font-family:var(--display)}
.kpi .sub{font-size:10px;color:var(--sub);margin-top:4px}
.pb{height:5px;background:var(--muted);border-radius:3px;overflow:hidden;margin:6px 0}
.pbi{height:100%;border-radius:3px;transition:width .5s ease;background:var(--accent)}

/* Headings */
h1,h2,h3,h4,h5{font-family:var(--display);letter-spacing:-0.01em}
.view-title{font-size:24px;font-weight:800;margin-bottom:4px}
.view-sub{font-size:11px;color:var(--sub);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px}

/* Buttons */
.btn{padding:9px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all .15s;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn-p{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-p:hover{opacity:0.85}
.btn-g{background:transparent}
.btn-r{background:var(--red);color:#fff;border-color:var(--red)}
.btn-r:hover{opacity:0.85}
.btn-sm{padding:6px 10px;font-size:10px}
.brow{display:flex;gap:8px;flex-wrap:wrap}

/* Inputs */
.inp{width:100%;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--body);font-size:13px;transition:border-color .15s}
.inp:focus{outline:none;border-color:var(--accent)}
.inp::placeholder{color:var(--text-dim)}
textarea.inp{resize:vertical;min-height:60px;font-family:var(--body)}

/* Stages & tasks */
.stage{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.stage.expanded{border-color:var(--accent)}
.stage-head{padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
.stage-num{font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.15em}
.stage-title{flex:1;font-family:var(--display);font-size:15px;font-weight:700}
.stage-meta{display:flex;gap:8px;font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.1em}
.stage-meta .effort{color:var(--accent)}
.stage-prog{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.stage-chev{color:var(--sub);font-size:14px;transition:transform .2s}
.stage.expanded .stage-chev{transform:rotate(90deg)}
.stage-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.stage.expanded .stage-body{display:block}
.stage-tagline{padding:12px 0;color:var(--text);font-size:13px;line-height:1.6}
.stage-section{margin-top:14px}
.stage-section-title{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}

.task{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:6px;transition:all .15s}
.task:hover{border-color:var(--border2)}
.task.done{opacity:0.55}
.task.done .task-text{text-decoration:line-through;color:var(--sub)}
.task-check{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;background:var(--bg)}
.task-check:hover{border-color:var(--accent)}
.task-check.checked{background:var(--accent);border-color:var(--accent)}
.task-check.checked::after{content:'\2713';color:var(--bg);font-size:13px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;line-height:1.5;color:var(--text);cursor:pointer}
.task-meta{display:flex;gap:8px;margin-top:4px;font-family:var(--mono);font-size:9px;color:var(--text-dim);letter-spacing:.05em;align-items:center;flex-wrap:wrap}
.task-meta .ts{color:var(--sub)}
.task-actions{display:flex;gap:4px;flex-shrink:0;opacity:0.4;transition:opacity .15s}
.task:hover .task-actions{opacity:1}
.task-act{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:3px}
.task-act:hover{background:var(--muted);color:var(--text)}

/* Region pills */
.region-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);background:var(--surface);color:var(--sub);margin-right:4px;margin-bottom:4px}
.region-pill.lit{border-color:var(--region);color:var(--region);background:var(--region-bg);box-shadow:0 0 8px var(--region-shadow)}
.region-pill.love{--region:var(--region-love);--region-bg:rgba(255,107,157,0.1);--region-shadow:rgba(255,107,157,0.2)}
.region-pill.good_at{--region:var(--region-good);--region-bg:rgba(200,241,53,0.1);--region-shadow:rgba(200,241,53,0.2)}
.region-pill.world_needs{--region:var(--region-needs);--region-bg:rgba(0,212,255,0.1);--region-shadow:rgba(0,212,255,0.2)}
.region-pill.paid_for{--region:var(--region-paid);--region-bg:rgba(255,170,61,0.1);--region-shadow:rgba(255,170,61,0.2)}
.region-pill.passion,.region-pill.mission,.region-pill.profession,.region-pill.vocation,.region-pill.centre{--region:var(--accent);--region-bg:rgba(200,241,53,0.08);--region-shadow:rgba(200,241,53,0.18)}
.region-pill.centre{--region:var(--orange);--region-bg:rgba(255,140,66,0.12);--region-shadow:rgba(255,140,66,0.25);font-weight:700}

/* Compound flash overlay */
.compound-flash{position:fixed;bottom:90px;left:14px;right:14px;background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;z-index:9998;transform:translateY(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 32px rgba(200,241,53,0.18);max-width:480px;margin:0 auto}
.compound-flash.show{transform:translateY(0)}
.compound-flash-head{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.compound-flash-body{font-size:13px;line-height:1.5;color:var(--text)}
.compound-flash-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;z-index:9999;transition:transform .25s;text-transform:uppercase}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Sheet / drawer / overlay */
.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:calc(60px + var(--safe-b));background:rgba(0,0,0,0.6);z-index:200;display:none;opacity:0;transition:opacity .25s}
.sheet-overlay.show{display:block;opacity:1}
.sheet{position:fixed;bottom:calc(60px + var(--safe-b));left:0;right:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:calc(92dvh - 60px);display:flex;flex-direction:column;border-top:1px solid var(--border)}
.sheet.show{transform:translateY(0)}
.sheet-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-title{font-family:var(--display);font-size:15px;font-weight:700;flex:1}
.sheet-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:22px;line-height:1;padding:0;width:28px;height:28px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:14px 18px;padding-bottom:calc(var(--safe-b) + 22px)}
.sheet-body label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--sub);margin:14px 0 6px}
.sheet-body label:first-child{margin-top:0}

/* Drawer */
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:calc(60px + var(--safe-b));background:rgba(0,0,0,0.6);z-index:150;display:none;opacity:0;transition:opacity .25s}
.drawer-overlay.show{display:block;opacity:1}
.drawer{position:fixed;bottom:calc(60px + var(--safe-b));left:0;right:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:151;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:14px 0 22px;border-top:1px solid var(--border)}
.drawer.show{transform:translateY(0)}
.drawer-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:var(--border)}
.drawer-btn{background:var(--surface);border:none;color:var(--text);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;transition:background .15s}
.drawer-btn:hover{background:var(--card)}
.drawer-icon{font-size:20px}

/* Empty states */
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty .icon{font-size:42px;margin-bottom:14px;opacity:0.4}
.empty h3{font-family:var(--display);font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6;max-width:320px;margin:0 auto}

/* Tags */
.tag{display:inline-block;padding:3px 8px;border-radius:3px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--muted);color:var(--sub);margin-right:4px}
.tag.tg{background:rgba(0,255,136,0.15);color:var(--green)}
.tag.tc{background:var(--accent-dim);color:var(--accent)}
.tag.to{background:rgba(255,140,66,0.15);color:var(--orange)}
.tag.tp{background:rgba(167,139,250,0.15);color:var(--purple)}
.tag.tr{background:rgba(239,68,68,0.15);color:var(--red)}
.tag.ty{background:rgba(234,179,8,0.15);color:var(--yellow)}

/* Note items */
.note{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.note-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase}
.note-body{font-size:13px;line-height:1.6;white-space:pre-wrap}
.note-actions{margin-top:8px;display:flex;gap:6px}

/* Capture quick */
.cap-quick{background:var(--card);border:1px dashed var(--border2);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px;cursor:pointer;transition:all .15s}
.cap-quick:hover{border-color:var(--accent);background:var(--accent-soft)}
.cap-quick .icon{font-size:24px;margin-bottom:8px;display:block}
.cap-quick .text{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--sub)}

/* Voice recording UI */
.voice-rec{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.voice-rec.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.voice-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:var(--bg);font-size:20px;cursor:pointer;flex-shrink:0;transition:all .15s}
.voice-btn:hover{transform:scale(1.05)}
.voice-btn.recording{background:var(--red);color:#fff;animation:pulse-rec 1.5s ease-in-out infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.voice-status{flex:1;font-size:12px;color:var(--sub);font-family:var(--mono);letter-spacing:.05em}
.voice-status.live{color:var(--red);font-weight:600}

/* Lexicon */
.lex-entry{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.lex-entry .term{font-family:var(--display);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px}
.lex-entry .lens{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
.lex-entry .body{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:8px}
.lex-entry .body p{margin-bottom:6px}
.lex-entry .examples{font-size:12px;color:var(--sub);font-style:italic;line-height:1.6;border-left:2px solid var(--border);padding-left:10px;margin-top:8px}

/* Region grid (Lens view) */
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.region-cell{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s}
.region-cell:hover{border-color:var(--accent)}
.region-cell .region-name{font-family:var(--display);font-size:14px;font-weight:700;margin-bottom:4px}
.region-cell .region-count{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.05em}
.region-cell .region-fill{height:4px;background:var(--muted);border-radius:2px;margin-top:8px;overflow:hidden}
.region-cell .region-fill-inner{height:100%;border-radius:2px;transition:width .5s ease}
.region-cell.love .region-fill-inner{background:var(--region-love)}
.region-cell.good_at .region-fill-inner{background:var(--region-good)}
.region-cell.world_needs .region-fill-inner{background:var(--region-needs)}
.region-cell.paid_for .region-fill-inner{background:var(--region-paid)}

/* Filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.chip{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:14px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s;text-transform:uppercase}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* Settings rows */
.setting-row{padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .label{font-size:13px;font-weight:600;margin-bottom:4px}
.setting-row .desc{font-size:11px;color:var(--sub);line-height:1.5;margin-bottom:8px}

/* Switch */
.switch{position:relative;display:inline-block;width:42px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch-track{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--muted);border:1px solid var(--border2);border-radius:22px;transition:.2s}
.switch-track:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:var(--sub);border-radius:50%;transition:.2s}
.switch input:checked + .switch-track{background:var(--accent-dim);border-color:var(--accent)}
.switch input:checked + .switch-track:before{transform:translateX(20px);background:var(--accent)}

/* Help text */
.help{padding:12px;background:var(--accent-soft);border:1px solid var(--accent-dim);border-radius:var(--radius);font-size:12px;line-height:1.6;color:var(--text);margin-bottom:14px}
.help strong{color:var(--accent)}
.help.warn{background:rgba(255,140,66,0.06);border-color:rgba(255,140,66,0.25)}
.help.warn strong{color:var(--orange)}

/* Brusselbach SVG container */
.brusselbach{display:flex;justify-content:center;padding:20px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.brusselbach svg{max-width:280px;height:auto}

/* Onboarding stepper */
.onb-step{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.onb-step h4{font-family:var(--display);font-size:14px;font-weight:700;margin-bottom:6px}
.onb-step .num{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--accent);margin-bottom:6px;text-transform:uppercase}
.onb-step p{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px}

@media(min-width:768px){.main{padding:18px 18px 10px}.kg{grid-template-columns:1fr 1fr 1fr 1fr}.kg3{grid-template-columns:repeat(3,1fr)}.region-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="colour-bar"></div>
  <div class="header">
    <div class="logo-dot"></div>
    <div class="logo-text">ikig<span class="accent">AI</span></div>
    <div class="logo-sub" id="hdr-sub">// the framework overlays</div>
    <div id="sync-status" style="font-size:9px;font-family:var(--mono);color:var(--sub);letter-spacing:.05em;cursor:pointer" onclick="openSettings()"></div>
  </div>
  <div class="main" id="mc"></div>

function loadS() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      const d = JSON.parse(raw);
      // Backfill any missing structure
      if (!d.captures) d.captures = [];
      if (!d.notes) d.notes = [];
      if (!d.lexicon) d.lexicon = LEXICON_SEED.slice();
      if (!d.ikigai_state) d.ikigai_state = { love: 0, good_at: 0, world_needs: 0, paid_for: 0, passion: 0, mission: 0, profession: 0, vocation: 0, centre: 0 };
      if (!d.stages) d.stages = STAGES_CANONICAL.map(s => ({ id: s.id, expanded: false, startedAt: null, completedAt: null }));
      if (!d.meta) d.meta = { schemaVersion: SCHEMA_VERSION, createdAt: Date.now(), lastSyncedAt: null };
      return d;
    }
    // Migrate from v0.2 if present
    const v02 = localStorage.getItem('ikigai_v0_2');
    if (v02) {
      try {
        const d = JSON.parse(v02);
        d.lexicon = LEXICON_SEED.slice();
        d.ikigai_state = { love: 0, good_at: 0, world_needs: 0, paid_for: 0, passion: 0, mission: 0, profession: 0, vocation: 0, centre: 0 };
        d.meta = d.meta || {};
        d.meta.schemaVersion = SCHEMA_VERSION;
        d.meta.migratedFromV02 = Date.now();
        return d;
      } catch (e) { /* fall through */ }
    }
  } catch (e) { console.error('loadS error:', e); }
  return emptyData();
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function uid() { return Date.now() + '-' + Math.floor(Math.random() * 1000); }
function fmtDate(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); }
function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }); }
function fmtRel(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 7) return d + 'd ago';
  return fmtDate(ts);
}
function escHtml(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m) {
  const t = document.querySelector('.toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function getStage(id) { return STAGES_CANONICAL.find(s => s.id === id); }
function getStageState(id) { return S.stages.find(s => s.id === id); }
function getStageTasks(id) { return S.tasks.filter(t => t.stageId === id); }
function stageProgress(id) {
  const tasks = getStageTasks(id);
  if (!tasks.length) return { done: 0, total: 0, pct: 0 };
  const done = tasks.filter(t => t.status === 'done').length;
  return { done, total: tasks.length, pct: Math.round((done / tasks.length) * 100) };
}
function totalProgress() {
  if (!S.tasks.length) return 0;
  const done = S.tasks.filter(t => t.status === 'done').length;
  return Math.round((done / S.tasks.length) * 100);
}
function totalEffortRemaining() {
  let total = 0;
  STAGES_CANONICAL.forEach(s => {
    const p = stageProgress(s.id);
    if (p.pct < 100) {
      const h = parseFloat(s.effort);
      if (!isNaN(h)) total += h * (1 - p.pct / 100);
    }
  });
  return Math.round(total * 10) / 10;
}
function currentStage() {
  for (const s of STAGES_CANONICAL) {
    const p = stageProgress(s.id);
    if (p.pct < 100) return s;
  }
  return null;
}
function nextTask(stageId) {
  return S.tasks.find(t => t.stageId === stageId && t.status !== 'done');
}

// ─── Region inference (cheap heuristic — actual classification happens at NUC ingest) ─
// For the local app, we infer regions from task text using keyword matching
// against the user's lexicon and ikigai.md hints. Very rough, deliberately so —
// the real classifier lives on the NUC.
function inferRegionsFromText(text) {
  if (!text) return [];
  const t = text.toLowerCase();
  const regions = new Set();
  // love markers
  if (/\b(love|enjoy|passion|excited|fascinat|hobby|creative|making|build|craft)\b/.test(t)) regions.add('love');
  // good_at markers  
  if (/\b(skill|good at|strong|expert|proficien|experienc|capable|deliver)\b/.test(t)) regions.add('good_at');
  // world_needs markers
  if (/\b(need|help|impact|community|social|public|world|society|sovereignty|open)\b/.test(t)) regions.add('world_needs');
  // paid_for markers
  if (/\b(paid|money|revenue|income|client|customer|business|commercial|monetis|sell)\b/.test(t)) regions.add('paid_for');
  // Always-applicable for IkigAI build tasks
  if (/\b(ikigai|coach|brain|self|sovereignty)\b/.test(t)) {
    regions.add('love'); regions.add('good_at');
  }
  // Add intersections
  const list = [...regions];
  if (list.includes('love') && list.includes('good_at')) regions.add('passion');
  if (list.includes('love') && list.includes('world_needs')) regions.add('mission');
  if (list.includes('good_at') && list.includes('paid_for')) regions.add('profession');
  if (list.includes('world_needs') && list.includes('paid_for')) regions.add('vocation');
  if (list.includes('love') && list.includes('good_at') && list.includes('world_needs') && list.includes('paid_for')) regions.add('centre');
  return [...regions];
}

function showCompoundFlash(text, regions) {
  if (!regions || !regions.length) return;
  const cf = document.getElementById('compound-flash');
  document.getElementById('cf-body').textContent = text;
  const pillsEl = document.getElementById('cf-pills');
  pillsEl.innerHTML = regions.map(r => `<span class="region-pill ${r} lit">${r.replace('_', ' ')}</span>`).join('');
  cf.classList.add('show');
  setTimeout(() => cf.classList.remove('show'), 4000);
}

    });

  html += '<div style="margin-top:18px;text-align:center"><button class="btn btn-g" onclick="openAddTask()">+ Add custom task</button></div>';

// ─── LENS view — Brusselbach Ikigai with live state ───────────────────────
function rLens(el) {
  let html = '<h1 class="view-title">Lens</h1>';
  html += '<div class="view-sub">// the framework, with your captures lighting it up</div>';

  // SVG Brusselbach
  html += '<div class="brusselbach">';
  html += `<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
    <circle cx="115" cy="100" r="80" fill="rgba(255,107,157,0.25)" stroke="#ff6b9d" stroke-width="1"/>
    <circle cx="165" cy="100" r="80" fill="rgba(0,212,255,0.25)" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="115" cy="150" r="80" fill="rgba(200,241,53,0.25)" stroke="#c8f135" stroke-width="1"/>
    <circle cx="165" cy="150" r="80" fill="rgba(255,170,61,0.25)" stroke="#ffaa3d" stroke-width="1"/>

    <text x="140" y="265" text-anchor="middle" fill="#ffaa3d" font-size="11" font-family="JetBrains Mono" font-weight="700">paid_for</text>
    <text x="90" y="100" text-anchor="middle" fill="#e8e8e2" font-size="9" font-family="JetBrains Mono">passion</text>
    <text x="190" y="100" text-anchor="middle" fill="#e8e8e2" font-size="9" font-family="JetBrains Mono">mission</text>
    <text x="90" y="160" text-anchor="middle" fill="#e8e8e2" font-size="9" font-family="JetBrains Mono">profession</text>
    <text x="190" y="160" text-anchor="middle" fill="#e8e8e2" font-size="9" font-family="JetBrains Mono">vocation</text>
    <text x="140" y="135" text-anchor="middle" fill="#c8f135" font-size="14" font-family="Syne" font-weight="800">CENTRE</text>
  </svg>`;
  html += '</div>';

  // Compute region distribution from completed tasks AND captures
  const allItems = [...S.tasks.filter(t => t.status === 'done'), ...S.captures];
  const regionCounts = { love: 0, good_at: 0, world_needs: 0, paid_for: 0, passion: 0, mission: 0, profession: 0, vocation: 0, centre: 0 };
  allItems.forEach(item => {
    const text = item.text || '';
    const regions = item.regions || inferRegionsFromText(text);
    regions.forEach(r => { if (regionCounts[r] !== undefined) regionCounts[r]++; });
  });

  const total = allItems.length || 1;

  html += '<div class="card">';
  html += '<div class="sl">// the four axes</div>';
  html += '<div class="region-grid">';
  ['love', 'good_at', 'world_needs', 'paid_for'].forEach(r => {
    const count = regionCounts[r] || 0;
    const pct = Math.min(100, Math.round((count / total) * 100));
    html += `<div class="region-cell ${r}" onclick="filterByRegion('${r}')">`;
    html += `<div class="region-name">${r.replace('_', ' ')}</div>`;
    html += `<div class="region-count">${count} ${count === 1 ? 'item' : 'items'}</div>`;
    html += `<div class="region-fill"><div class="region-fill-inner" style="width:${pct}%"></div></div>`;
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="sl">// the five intersections</div>';
  ['passion', 'mission', 'profession', 'vocation', 'centre'].forEach(r => {
    const count = regionCounts[r] || 0;
    html += '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)">';
    html += `<div style="flex:1"><strong style="font-family:var(--display);font-size:14px">${r}</strong>`;
    const labels = {
      passion: 'love + good_at',
      mission: 'love + world_needs',
      profession: 'good_at + paid_for',
      vocation: 'world_needs + paid_for',
      centre: 'all four'
    };
    html += `<div style="font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.1em">${labels[r]}</div></div>`;
    html += `<span class="region-pill ${r} ${count > 0 ? 'lit' : ''}">${count}</span>`;
    html += '</div>';
  });
  html += '</div>';

  // Drift detection
  const lightest = Object.entries(regionCounts).filter(([k]) => ['love','good_at','world_needs','paid_for'].includes(k)).sort((a,b) => a[1]-b[1])[0];
  if (lightest && lightest[1] === 0 && allItems.length > 3) {
    html += '<div class="help warn"><strong>Drift signal:</strong> <code>' + lightest[0].replace('_',' ') + '</code> has zero items. The system surfaces this without telling you what to do. You decide if the gap matters or the goal needs revisiting.</div>';
  }

  html += '<div class="help">Click any region above to filter captures and tasks by what touches it. The Lens is observational — it shows where your effort is landing across the framework, never tells you what to do about it.</div>';

  el.innerHTML = html;
}

// ─── Voice transcription (Web Speech API) ─────────────────────────────────
function toggleVoiceRec() {
  if (_voiceRecognition) {
    _voiceRecognition.stop();
    _voiceRecognition = null;
    document.getElementById('voice-btn').classList.remove('recording');
    document.getElementById('voice-rec').classList.remove('active');
    document.getElementById('voice-status').classList.remove('live');
    document.getElementById('voice-status').textContent = 'Tap to record \u00B7 transcribes live';
    return;
  }
  const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
  if (!SR) { toast('Voice not supported in this browser'); return; }
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-AU';
  let finalText = '';
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const ta = document.getElementById('cap-text');
    if (ta) {
      ta.value = (finalText + interim).trim();
    }
    document.getElementById('voice-status').textContent = '\u25CF LIVE \u00B7 ' + (finalText.length + interim.length) + ' chars';
  };
  r.onerror = (e) => {
    console.error('Voice error:', e);
    toast('Voice: ' + e.error);
    toggleVoiceRec();
  };
  r.onend = () => {
    if (_voiceRecognition === r) {
      _voiceRecognition = null;
      document.getElementById('voice-btn').classList.remove('recording');
      document.getElementById('voice-rec').classList.remove('active');
      document.getElementById('voice-status').classList.remove('live');
      document.getElementById('voice-status').textContent = 'Tap to record \u00B7 transcribes live';
    }
  };
  r.start();
  _voiceRecognition = r;
  document.getElementById('voice-btn').classList.add('recording');
  document.getElementById('voice-rec').classList.add('active');
  document.getElementById('voice-status').classList.add('live');
  document.getElementById('voice-status').textContent = '\u25CF LIVE \u00B7 listening';
  document.getElementById('cap-type').value = 'voice';
}

  showV(CV);

    html += '<div style="font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:.1em;margin-bottom:10px">\u2713 CONNECTED</div>';
    html += '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--text)">';
    html += '<span class="switch"><input type="checkbox" id="set-sync"' + (S.settings.driveSync ? ' checked' : '') + ' onchange="toggleDriveSync()"/><span class="switch-track"></span></span>';
    html += 'Auto-sync after every change';
    html += '</label>';
    html += '<div class="brow" style="margin-top:14px">';
    html += '<button class="btn btn-p" onclick="driveSave()">Push now</button>';
    html += '<button class="btn btn-g" onclick="driveLoad()">Pull now</button>';
    html += '<button class="btn btn-r" onclick="driveDisconnect()">Disconnect</button>';
    html += '</div>';
  } else {
    html += '<label>Client ID</label>';
    html += '<input type="text" class="inp" id="set-clientid" value="' + escHtml(S.settings.driveClientId || '') + '" placeholder="xxxxx.apps.googleusercontent.com"/>';
    html += '<div class="brow" style="margin-top:10px">';
    html += '<button class="btn btn-g" onclick="saveDriveClientId()">Save Client ID</button>';
    if (S.settings.driveClientId) html += '<button class="btn btn-p" onclick="driveAuth()">Connect Drive</button>';
    html += '</div>';
    html += '<div class="help" style="margin-top:10px;font-size:11px"><a href="https://console.cloud.google.com" target="_blank" style="color:var(--accent)">console.cloud.google.com</a> \u2192 APIs &amp; Services \u2192 Credentials \u2192 OAuth client ID (Web). Add this URL to authorised redirect URIs.</div>';
  }
  html += '</div>';

  html += '<div class="setting-row">';
  html += '<div class="label">Manual JSON</div>';
  html += '<div class="desc">Bypass Drive entirely. Export to file, drop wherever, import on any device.</div>';
  html += '<div class="brow"><button class="btn btn-g" onclick="exportJSON()">Export</button><button class="btn btn-g" onclick="importJSON()">Import</button></div>';
  html += '</div>';

  html += '<div class="setting-row">';
  html += '<div class="label">Data</div>';
  html += '<div class="desc">' + S.tasks.length + ' tasks &middot; ' + S.captures.length + ' captures &middot; ' + S.notes.length + ' notes &middot; ' + S.lexicon.length + ' lexicon entries</div>';
  html += '<div class="desc">Schema ' + S.meta.schemaVersion + ' &middot; created ' + fmtDate(S.meta.createdAt) + '</div>';
  if (S.meta.lastSyncedAt) html += '<div class="desc">Last synced ' + fmtRel(S.meta.lastSyncedAt) + '</div>';
  html += '<div style="margin-top:10px"><button class="btn btn-r" onclick="confirmReset()">Reset all</button></div>';
  html += '</div>';

  openSheet('Settings', html);

  setTimeout(() => {
    const v = document.getElementById('set-voice');
    if (v) v.onchange = () => { S.settings.voicePref = v.value; saveS(); toast('Voice saved'); };
  }, 50);
}

function toggleVoiceTx() {
  S.settings.voiceTranscriptionEnabled = document.getElementById('set-voice-tx').checked;
  saveS();
}

function saveDriveClientId() {
  S.settings.driveClientId = document.getElementById('set-clientid').value.trim();
  saveS();
  toast('Client ID saved');
  openSettings();
}

function toggleDriveSync() {
  S.settings.driveSync = document.getElementById('set-sync').checked;
  saveS();
  toast(S.settings.driveSync ? 'Auto-sync ON' : 'Auto-sync OFF');
}

function driveDisconnect() {
  if (!confirm('Disconnect Drive? Your local data stays.')) return;
  S.settings.driveToken = null;
  S.settings.driveSync = false;
  saveS();
  toast('Disconnected');
  openSettings();
}

// ─── Drive sync (forked from RenovAIter) ──────────────────────────────────
function driveAuth() {
  const clientId = S.settings.driveClientId;
  if (!clientId) { toast('Save a Client ID first'); return; }
  const redirect = window.location.href.split('?')[0].split('#')[0];
  const scope = 'https://www.googleapis.com/auth/drive.file';
  const url = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(clientId) +
    '&redirect_uri=' + encodeURIComponent(redirect) +
    '&response_type=token&scope=' + encodeURIComponent(scope);
  window.location.href = url;
}

function handleDriveCallback() {
  const hash = window.location.hash;
  if (!hash || !hash.includes('access_token')) return;
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get('access_token');
  if (token) {
    S.settings.driveToken = token;
    saveS();
    window.location.hash = '';
    toast('Drive connected');
  }
}

async function driveFindFile() {
  if (!S.settings.driveToken) return null;
  try {
    const res = await fetch('https://www.googleapis.com/drive/v3/files?q=name=\'' + DRIVE_FILE_NAME + '\'+and+trashed=false&spaces=drive&fields=files(id,name)', {
      headers: { 'Authorization': 'Bearer ' + S.settings.driveToken }
    });
    if (!res.ok) {
      if (res.status === 401) { S.settings.driveToken = null; saveS(); toast('Drive session expired'); }
      return null;
    }
    const data = await res.json();
    return data.files && data.files.length ? data.files[0].id : null;
  } catch (e) { console.error(e); return null; }
}

async function driveSave() {
  if (!S.settings.driveToken) { toast('Connect Drive first'); return; }
  toast('Saving to Drive\u2026');
  const exportData = JSON.parse(JSON.stringify(S));
  delete exportData.settings.driveToken;
  const content = JSON.stringify(exportData, null, 2);
  const fileId = await driveFindFile();
  try {
    if (fileId) {
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + S.settings.driveToken, 'Content-Type': 'application/json' },
        body: content
      });
      if (res.ok) { S.meta.lastSyncedAt = Date.now(); saveS(); toast('Saved'); }
      else toast('Save failed');
    } else {
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([content], { type: 'application/json' }));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + S.settings.driveToken },
        body: form
      });
      if (res.ok) { S.meta.lastSyncedAt = Date.now(); saveS(); toast('Saved'); }
      else toast('Save failed');
    }
  } catch (e) { console.error(e); toast('Drive error'); }
}

async function driveLoad() {
  if (!S.settings.driveToken) { toast('Connect Drive first'); return; }
  if (!confirm('Replace local data with Drive data?')) return;
  toast('Loading\u2026');
  const fileId = await driveFindFile();
  if (!fileId) { toast('No sync file on Drive'); return; }
  try {
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
      headers: { 'Authorization': 'Bearer ' + S.settings.driveToken }
    });
    if (!res.ok) { toast('Load failed'); return; }
    const data = await res.json();
    if (data.tasks && data.stages) {
      const token = S.settings.driveToken;
      const clientId = S.settings.driveClientId;
      S = data;
      S.settings.driveToken = token;
      S.settings.driveClientId = clientId;
      S.meta.lastSyncedAt = Date.now();
      saveS();
      showV('today');
      toast('Loaded');
    } else toast('Invalid data');
  } catch (e) { console.error(e); toast('Drive error'); }
}

function syncToDrive() {
  if (!S.settings.driveToken || !S.settings.driveSync) return;
  clearTimeout(window._driveSyncTimer);
  window._driveSyncTimer = setTimeout(() => driveSave().catch(() => {}), 5000);
}

// ─── JSON export/import ───────────────────────────────────────────────────
function exportJSON() {
  const exportData = JSON.parse(JSON.stringify(S));
  delete exportData.settings.driveToken;
  const content = JSON.stringify(exportData, null, 2);
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  a.href = url;
  a.download = 'ikigai-state-' + date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported');
}

function importJSON() { document.getElementById('file-import').click(); }

function handleImport(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  if (!confirm('Replace all local data with the imported file?')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.tasks || !data.stages) { toast('Invalid file'); return; }
      const token = S.settings.driveToken;
      const clientId = S.settings.driveClientId;
      S = data;
      if (token) S.settings.driveToken = token;
      if (clientId) S.settings.driveClientId = clientId;
      saveS();
      showV('today');
      toast('Imported');
    } catch (err) { console.error(err); toast('Parse failed'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function confirmReset() {
  if (!confirm('Reset everything? This wipes tasks, captures, notes, lexicon, settings.')) return;
  if (!confirm('Really? Last chance.')) return;
  localStorage.removeItem(SK);
  S = emptyData();
  saveS();
  closeSheet();
  showV('today');
  toast('Reset');
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;

    el.textContent = '\u27F3 SYNC';
